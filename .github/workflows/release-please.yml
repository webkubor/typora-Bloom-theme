name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release-type: node

      # Tag/release created via GITHUB_TOKEN cannot trigger other workflows,
      # so the theme zip must be built and attached here (issue #19: v1.3.5
      # shipped without Bloom-theme.zip / the Wheat theme).
      - name: Checkout
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/checkout@v4

      - name: Build release zip
        if: ${{ steps.release.outputs.release_created }}
        run: node scripts/package.js

      - name: Upload zip to release
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ steps.release.outputs.tag_name }}" Bloom-theme.zip --clobber
